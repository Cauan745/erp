name: stockroom-vps-test

services:
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8081"
    environment:
      API_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/stockroom
      SPRING_DATASOURCE_USERNAME: stockroom
      SPRING_DATASOURCE_PASSWORD: stockroom_test_only
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom_test_only
    volumes:
      - vps_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  vps_test_data:
