services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
    ports:
      - "5432:5432"
    volumes:
      - stockroom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stockroom-postgres:
