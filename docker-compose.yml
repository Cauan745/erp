name: stockroom-online
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockroom}
      POSTGRES_USER: ${POSTGRES_USER:-stockroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockroom_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - stockroom_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
  db-test:
    image: postgres:18.6
    profiles: [test]
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB:-stockroom_test}
      POSTGRES_USER: ${TEST_DATABASE_USERNAME:-stockroom}
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD:-stockroom_dev}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55433}:5432"
    volumes:
      - stockroom_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  stockroom_data:
  stockroom_test_data:
